<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>棋 Tichu-Sprechstunde</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tichu">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#E4E4E2;
    --ink-2:#F5F5F3;
    --ink-3:#DADAD6;
    --hairline:#C4C4C0;
    --gold:#E8B923;
    --gold-dim:#8A6A16;
    --jade:#2FA84F;
    --jade-dim:#1F7A38;
    --steel:#2E9BD6;
    --steel-dim:#1F6E9C;
    --red:#D93A2B;
    --red-dim:#8F241A;
    --text:#1A1A1A;
    --text-dim:#4A4A4A;
    --text-faint:#767672;
    --radius:14px;
    --font-ui:'Manrope',system-ui,sans-serif;
    --font-display:'Fraunces',serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E4E4E2; --ink-2:#F5F5F3; --ink-3:#DADAD6; --hairline:#C4C4C0;
      --gold:#E8B923; --gold-dim:#8A6A16; --jade:#2FA84F; --jade-dim:#1F7A38;
      --steel:#2E9BD6; --steel-dim:#1F6E9C; --red:#D93A2B; --red-dim:#8F241A;
      --text:#1A1A1A; --text-dim:#4A4A4A; --text-faint:#767672;
    }
  }
  :root[data-theme="dark"]{
    --ink:#E4E4E2; --ink-2:#F5F5F3; --ink-3:#DADAD6; --hairline:#C4C4C0;
    --gold:#E8B923; --gold-dim:#8A6A16; --jade:#2FA84F; --jade-dim:#1F7A38;
    --steel:#2E9BD6; --steel-dim:#1F6E9C; --red:#D93A2B; --red-dim:#8F241A;
    --text:#1A1A1A; --text-dim:#4A4A4A; --text-faint:#767672;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:radial-gradient(1200px 800px at 15% -10%, #F1E2D8 0%, var(--ink) 55%);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:16px;
    line-height:1.4;
    min-height:100vh;
    overscroll-behavior:none;
  }
  #app{max-width:1180px; margin:0 auto; padding:20px 20px 48px; min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0 0 4px; letter-spacing:0.2px;}
  h1{font-size:28px;}
  h2{font-size:22px;}
  h3{font-size:17px; font-weight:600;}
  p{margin:0;}
  .muted{color:var(--text-dim);}
  .faint{color:var(--text-faint); font-size:13px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px;
    background:linear-gradient(160deg, var(--red), var(--red-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:600; font-size:19px; color:#FBEAE6;
    flex-shrink:0;
  }
  .iconbtn{
    background:transparent; border:1px solid var(--hairline); color:var(--text);
    width:44px; height:44px; border-radius:12px; font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn:active{background:var(--ink-3);}
  .btn{
    font-family:var(--font-ui); font-weight:700; font-size:15px;
    border-radius:12px; border:1px solid transparent; cursor:pointer;
    padding:14px 20px; min-height:52px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--jade); color:#0B140F;}
  .btn-secondary{background:var(--ink-3); color:var(--text); border-color:var(--hairline);}
  .btn-ghost{background:transparent; color:var(--text-dim); border-color:var(--hairline);}
  .btn-danger{background:transparent; color:var(--red); border-color:var(--red);}
  .btn-gold{background:var(--gold); color:#241A05;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-block{width:100%;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .grid{display:grid; gap:14px;}
  .avatar-badge{display:inline-flex; align-items:center; justify-content:center; border-radius:999px; overflow:hidden; flex-shrink:0; vertical-align:middle;}
  .avatar-inline{display:inline-flex; align-items:center; gap:7px; vertical-align:middle;}
  .avatar-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin-top:6px;}
  @media (max-width:640px){ .avatar-grid{grid-template-columns:repeat(5, 1fr);} }
  .avatar-pick-btn{background:var(--ink-3); border:1.5px solid var(--hairline); border-radius:12px; padding:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .avatar-pick-btn:disabled{cursor:not-allowed;}
  .avatar-pick-btn:not(:disabled):active{border-color:var(--gold);}
  .score-side-names{display:flex; flex-direction:column; gap:4px;}
  .stats-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));}
  .stats-grid > .card{margin-bottom:0;}
  .user-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;}
  @media (max-width:640px){ .user-grid{grid-template-columns:repeat(2, 1fr);} }
  .user-tile{background:var(--ink-2); border:1px solid var(--hairline); border-radius:var(--radius); padding:16px 10px; text-align:center; position:relative;}
  .user-tile-remove{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--text-faint); font-size:16px; cursor:pointer; padding:4px;}
  .user-tile-name{margin-top:10px; font-weight:700; font-size:14px; cursor:pointer; word-break:break-word;}
  .card{
    background:var(--ink-2); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:18px;
  }
  .card-gold{border-color:var(--gold-dim);}
  .section{margin-bottom:26px;}
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--ink-3); border:1px solid var(--hairline); color:var(--text);
    border-radius:999px; padding:10px 16px; font-weight:600; font-size:14.5px; cursor:pointer;
    user-select:none;
  }
  .chip.selected{background:var(--jade-dim); border-color:var(--jade); color:#EAFBF4;}
  .chip.team-a{border-color:var(--jade); color:var(--jade);}
  .chip.team-b{border-color:var(--steel); color:var(--steel);}
  .chip-remove{opacity:0.7; font-weight:800;}
  input[type=text], input[type=number]{
    background:var(--ink); border:1.5px solid var(--hairline); color:var(--text);
    border-radius:10px; padding:13px 14px; font-family:var(--font-ui); font-size:16px;
    width:100%;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  label.field-label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
  .empty{
    border:1.5px dashed var(--hairline); border-radius:var(--radius); padding:30px 20px;
    text-align:center; color:var(--text-faint);
  }
  .list-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--ink-2); border:1px solid var(--hairline); border-radius:12px;
    padding:14px 16px; cursor:pointer;
  }
  .list-item:active{background:var(--ink-3);}
  .badge{
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--ink-3); color:var(--text-dim); border:1px solid var(--hairline);
  }
  .badge-live{background:rgba(47,168,79,0.18); color:var(--jade); border-color:var(--jade-dim);}
  .scorebar{
    display:flex; align-items:stretch; border-radius:var(--radius); overflow:hidden; border:1px solid var(--hairline);
    min-height:96px;
  }
  .score-side{flex:1; padding:16px 18px; display:flex; flex-direction:column; justify-content:center; gap:4px;}
  .score-side.a{background:linear-gradient(160deg, rgba(47,168,79,0.38), rgba(47,168,79,0.12));}
  .score-side.b{background:linear-gradient(200deg, rgba(46,155,214,0.38), rgba(46,155,214,0.12)); text-align:right;}
  .score-side.a .score-num{color:var(--jade);}
  .score-side.b .score-num{color:var(--steel);}
  .score-num{font-family:var(--font-display); font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .score-names{font-size:13.5px; color:var(--text-dim); font-weight:600;}
  .score-mid{width:1px; background:var(--hairline);}
  .target-note{text-align:center; font-size:12.5px; color:var(--text-faint); margin-top:8px;}
  .call-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--hairline);}
  .call-row:last-child{border-bottom:none;}
  .call-name{font-weight:700; font-size:15px;}
  .call-side{font-size:12px; font-weight:700;}
  .call-side.a{color:var(--jade);} .call-side.b{color:var(--steel);}
  .seg{display:flex; border:1px solid var(--hairline); border-radius:10px; overflow:hidden;}
  .seg button{
    flex:1; background:transparent; border:none; color:var(--text-dim); font-family:var(--font-ui);
    font-weight:700; font-size:12.5px; padding:9px 8px; cursor:pointer; border-left:1px solid var(--hairline);
  }
  .seg button:first-child{border-left:none;}
  .seg button.active{background:var(--gold); color:#241A05;}
  .seg button.active.fail{background:var(--red); color:#FBEAE7;}
  .points-row{display:flex; align-items:center; gap:14px;}
  .points-col{flex:1;}
  .sum-check{text-align:center; font-weight:700; font-size:14px; padding:10px; border-radius:10px; margin-top:10px;}
  .sum-ok{background:rgba(47,168,79,0.15); color:var(--jade);}
  .sum-bad{background:rgba(217,58,43,0.18); color:var(--red-dim);}
  .dbl-row{display:flex; gap:10px;}
  .dbl-btn{flex:1; border-radius:10px; border:1.5px solid var(--hairline); background:transparent; color:var(--text-dim); padding:12px; font-family:var(--font-ui); font-weight:700; font-size:13.5px; cursor:pointer;}
  .dbl-btn.on-a{border-color:var(--jade); background:rgba(47,168,79,0.15); color:var(--jade);}
  .dbl-btn.on-b{border-color:var(--steel); background:rgba(46,155,214,0.15); color:var(--steel);}
  .round-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--hairline); font-size:14px;}
  .round-item:last-child{border-bottom:none;}
  .round-meta{color:var(--text-faint); font-size:12.5px;}
  .round-tile{background:var(--ink-2); border:1px solid var(--hairline); border-radius:var(--radius); padding:18px;}
  .round-tile-score{display:flex; align-items:baseline; justify-content:center; gap:16px; margin-bottom:12px; font-family:var(--font-display);}
  .round-tile-score .rt-num{font-size:36px; font-weight:600; font-variant-numeric:tabular-nums;}
  .round-tile-score .rt-sep{font-size:22px; color:var(--text-faint);}
  .event-tiles{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .event-tile{display:inline-flex; align-items:center; padding:14px 18px; border-radius:12px; font-weight:700; font-size:16px; border:1.5px solid transparent;}
  .event-tile.et-tichu{background:rgba(47,168,79,0.16); color:var(--jade); border-color:var(--jade-dim);}
  .event-tile.et-grosses{background:rgba(232,185,35,0.20); color:var(--gold-dim); border-color:var(--gold-dim);}
  .event-tile.et-fail{background:rgba(217,58,43,0.16); color:var(--red-dim); border-color:var(--red-dim);}
  .event-tile.et-doublewin{background:rgba(46,155,214,0.16); color:var(--steel); border-color:var(--steel-dim);}
  .progress-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .progress-row:last-child{margin-bottom:0;}
  .progress-label{width:100px; flex-shrink:0; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .progress-track{flex:1; height:14px; background:var(--ink-3); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px;}
  .progress-remain{width:76px; flex-shrink:0; text-align:right; font-size:12.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;}
  .pencil{background:transparent; border:none; color:var(--text-faint); font-size:17px; cursor:pointer; padding:6px;}
  .warn-banner{background:rgba(232,185,35,0.15); border:1px solid var(--gold-dim); color:var(--gold-dim); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:14px;}
  .tag-doublewin{color:var(--red); font-weight:700;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(6,10,8,0.72); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50;}
  .modal{background:var(--ink-2); border:1px solid var(--hairline); border-radius:16px; padding:22px; max-width:380px; width:100%;}
  .stepper{display:flex; align-items:center; gap:12px;}
  .stepper button{width:44px; height:44px; border-radius:10px; border:1px solid var(--hairline); background:var(--ink-3); color:var(--text); font-size:20px; cursor:pointer;}
  .divider{height:1px; background:var(--hairline); margin:18px 0;}
  .center-note{text-align:center; padding:60px 20px;}
  .flow-actions{display:flex; gap:12px; margin-top:22px;}
  .tag-pause{color:var(--text-faint); font-size:13px;}
  table.stat{width:100%; border-collapse:collapse; font-size:14px;}
  table.stat th, table.stat td{padding:9px 6px; text-align:left; border-bottom:1px solid var(--hairline);}
  table.stat th{color:var(--text-faint); font-weight:700; font-size:12px; text-transform:none;}
  ::selection{background:var(--gold-dim); color:#fff;}
  @media (max-width:640px){
    .score-num{font-size:32px;}
    #app{padding:16px 14px 40px;}
  }
</style>
</head>

  var AVATAR_BY_ID = {};
  AVATARS.forEach(function(a){ AVATAR_BY_ID[a.id] = a; });

  function avatarImgTag(av, size, dim){
    return '<span class="avatar-badge" style="width:'+size+'px;height:'+size+'px;'+(dim?"opacity:0.35;":"")+'"><img src="'+av.img+'" width="'+size+'" height="'+size+'" style="width:100%;height:100%;object-fit:cover;display:block;" alt=""></span>';
  }

  function avatarForPlayer(pid, size){
    size = size||28;
    var p = findPlayer(pid);
    if(p && p.avatarId && AVATAR_BY_ID[p.avatarId]){
      return avatarImgTag(AVATAR_BY_ID[p.avatarId], size, false);
    }
    var initial = p && p.name ? p.name.charAt(0).toUpperCase() : "?";
    return '<span class="avatar-badge" style="width:'+size+'px;height:'+size+'px; background:var(--ink-3); border:1px solid var(--hairline); color:var(--text-faint); font-weight:700; font-size:'+Math.round(size*0.42)+'px;">'+escapeHtml(initial)+'</span>';
  }

  function nameWithAvatar(pid, size){
    return '<span class="avatar-inline">'+avatarForPlayer(pid, size)+'<span>'+escapeHtml(playerName(pid))+'</span></span>';
  }

  function avatarColorForPlayer(pid){
    function avatarColorVar(c){ return {red:"var(--red)", gold:"var(--gold)", green:"var(--jade)", blue:"var(--steel)"}[c] || "var(--gold)"; }
    var p = findPlayer(pid);
    if(p && p.avatarId){
      var av = AVATARS.find(function(a){ return a.id===p.avatarId; });
      if(av) return avatarColorVar(av.color);
    }
    return "var(--gold)";
  }

  function progressTile(rows){
    var html = '<div class="card section"><h3 style="margin-bottom:12px;">Fortschritt zu '+TARGET_SCORE+'</h3>';
    rows.forEach(function(row){
      var pct = Math.max(0, Math.min(100, (row.value/TARGET_SCORE)*100));
      var remain = TARGET_SCORE - row.value;
      var remainText = remain>0 ? remain+" fehlen" : "erreicht";
      html += '<div class="progress-row">' +
                '<div class="progress-label">'+row.label+'</div>' +
                '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%; background:'+row.color+';"></div></div>' +
                '<div class="progress-remain">'+remainText+'</div>' +
              '</div>';
    });
    html += '</div>';
    return html;
  }

  /* ---------- state ---------- */
  var state = null;
  var nav = { view:"home" };

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  function defaultState(){
    return { players: [], sessions: [], demoActive:false };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = JSON.parse(raw); }
      else { state = defaultState(); }
    }catch(e){ state = defaultState(); }
    if(!state.players) state.players = [];
    if(!state.sessions) state.sessions = [];
    if(typeof state.demoActive!=="boolean") state.demoActive = false;
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable — continue in-memory */ }
  }

  function findPlayer(id){ return state.players.find(function(p){return p.id===id;}); }
  function playerName(id){ var p = findPlayer(id); return p ? p.name : "?"; }
  function findSession(id){ return state.sessions.find(function(s){return s.id===id;}); }
  function findMatch(session, id){ return session.matches.find(function(m){return m.id===id;}); }
  function findTeam(session, id){ return (session.teams||[]).find(function(t){return t.id===id;}); }

  /* ---------- transient (non-persisted) selection state ---------- */
  var draft = {};
  function resetDraft(){ draft = {}; }

  /* ---------- render root ---------- */
  var root = document.getElementById("app");
  function render(){
    var html = "";
    switch(nav.view){
      case "home": html = viewHome(); break;
      case "playerSelect": html = viewPlayerSelect(); break;
      case "modeOptions": html = viewModeOptions(); break;
      case "teamSetup": html = viewTeamSetup(); break;
      case "matchIntro": html = viewMatchIntro(); break;
      case "match": html = viewMatch(); break;
      case "matchEnd": html = viewMatchEnd(); break;
      case "sessionSummary": html = viewSessionSummary(); break;
      case "stats": html = viewStats(); break;
      case "allSessions": html = viewAllSessions(); break;
      case "matchHistory": html = viewMatchHistory(); break;
      default: html = viewHome();
    }
    root.innerHTML = html;
    var oldModal = document.querySelector(".modal-backdrop");
    if(oldModal) oldModal.remove();
    if(modalState){ renderModal(); }
  }

  function go(view, extra){
    nav = Object.assign({view:view}, extra||{});
    window.scrollTo(0,0);
    render();
  }

  /* ---------- modal (confirm) ---------- */
  var modalState = null;
  function confirmModal(text, onYes){
    modalState = { text: text, onYes: onYes };
    render();
  }
  function closeModal(){ modalState = null; render(); }
  function renderModal(){
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="modal-backdrop" data-close-modal="1">' +
        '<div class="modal" id="modalBox">' +
          '<p style="margin-bottom:18px; font-size:15px;">'+escapeHtml(modalState.text)+'</p>' +
          '<div class="row">' +
            '<button class="btn btn-ghost" style="flex:1" data-modal-cancel="1">Abbrechen</button>' +
            '<button class="btn btn-danger" style="flex:1" data-modal-confirm="1">Bestätigen</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap.firstChild);
  }

  /* ---------- helpers ---------- */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'}) + " · " +
           d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
  }

  /* =====================================================================
     HOME
  ===================================================================== */
  function viewHome(){
    var active = state.sessions.filter(function(s){return s.status==="active";})
                  .sort(function(a,b){return b.createdAt-a.createdAt;});
    var done = state.sessions.filter(function(s){return s.status!=="active";})
                  .sort(function(a,b){return b.createdAt-a.createdAt;});

    var html = '';
    html += '<div class="topbar">' +
              '<div class="brand"><div class="brand-mark">龍</div><div><h1>Tichu-Sprechstunde</h1><p class="faint">Für alle mit klarer Haltung und schlechten Karten.</p></div></div>' +
              '<span class="row" style="gap:8px;">' +
                '<button class="iconbtn" data-action="openStats" title="Statistiken">📊</button>' +
                '<button class="iconbtn" data-action="openAllSessions" title="Alle Spiele">📜</button>' +
                '<button class="iconbtn" data-action="openLibrary" title="Users">☰</button>' +
              '</span>' +
            '</div>';

    html += '<div class="section">' +
              '<button class="btn btn-primary btn-block" data-action="newSession" style="font-size:16.5px;">+ Neues Spiel starten</button>' +
            '</div>';

    if(active.length){
      html += '<div class="section"><h2>Laufende Spiele</h2><div class="grid" style="margin-top:12px;">';
      active.forEach(function(s){
        html += sessionListItem(s, true);
      });
      html += '</div></div>';
    }

    html += statsHomeBlock();

    html += '<div class="section"><h2>Abgeschlossene Spiele</h2><div class="grid" style="margin-top:12px;">';
    if(done.length){
      done.slice(0,3).forEach(function(s){ html += sessionListItem(s, false); });
    } else {
      html += '<div class="empty">Noch keine abgeschlossenen Spiele. Startet eure erste Runde oben.</div>';
    }
    html += '</div>';
    if(done.length>3){
      html += '<button class="btn btn-ghost btn-block" style="margin-top:12px;" data-action="openAllSessions">Alle '+done.length+' Spiele ansehen →</button>';
    }
    html += '</div>';

    html += '<div class="card section" style="display:flex; align-items:center; justify-content:space-between; gap:14px;">' +
              '<div><h3 style="margin-bottom:4px;">Testdaten</h3><p class="faint">10 Testspieler:innen &amp; 20 Spiele in allen Modi — zum Ausprobieren und für Statistik-Tests.</p></div>' +
              '<button class="btn '+(state.demoActive?'btn-danger':'btn-secondary')+'" style="flex-shrink:0;" data-action="toggleDemo">'+(state.demoActive?'Entfernen':'Aktivieren')+'</button>' +
            '</div>';

    html += '<div class="card section">' +
              '<h3 style="margin-bottom:4px;">Daten sichern &amp; wiederherstellen</h3>' +
              '<p class="faint" style="margin-bottom:12px;">Exportiert alle Spieler, Spiele und Statistiken als Datei — zum Sichern oder Übertragen auf ein anderes Gerät.</p>' +
              '<div class="row">' +
                '<button class="btn btn-secondary" data-action="exportData">⬇ Exportieren</button>' +
                '<button class="btn btn-secondary" data-action="triggerImport">⬆ Importieren</button>' +
              '</div>' +
              '<input type="file" id="importFileInput" accept=".json,application/json" style="display:none;">' +
            '</div>';

    return html;
  }

  function viewAllSessions(){
    var done = state.sessions.filter(function(s){return s.status!=="active";})
                  .sort(function(a,b){return b.createdAt-a.createdAt;});
    var html = topNavWithIcons("Alle Spiele");
    html += '<div class="grid">';
    if(done.length){
      done.forEach(function(s){ html += sessionListItem(s, false); });
    } else {
      html += '<div class="empty">Noch keine abgeschlossenen Spiele.</div>';
    }
    html += '</div>';
    return html;
  }

  function sessionListItem(s, isActive){
    var names = s.playerIds.map(playerName).join(", ");
    var badge = isActive
      ? '<span class="badge badge-live">läuft</span>'
      : '<span class="badge">'+(s.status==="aborted"?"abgebrochen":"beendet")+'</span>';
    return '<div class="list-item" data-action="openSession" data-id="'+s.id+'">' +
             '<div><h3 style="margin-bottom:3px;">'+s.mode+' Spieler · '+fmtDate(s.createdAt)+(s.demo?' <span class="faint">🧪 Test</span>':'')+'</h3>' +
             '<p class="faint">'+escapeHtml(names)+'</p></div>' +
             '<span class="row" style="gap:10px; align-items:center; flex-wrap:nowrap;">' + badge +
               '<button data-action="deleteSession" data-id="'+s.id+'" style="background:none; border:none; color:var(--text-faint); font-size:17px; cursor:pointer; padding:4px;">✕</button>' +
             '</span>' +
           '</div>';
  }

  function deleteSession(id){
    confirmModal("Dieses Spiel wirklich unwiderruflich löschen? Alle Runden und Ergebnisse gehen verloren.", function(){
      state.sessions = state.sessions.filter(function(s){return s.id!==id;});
      save();
      closeModal();
    });
  }

  /* =====================================================================
     PLAYER LIBRARY (quick add/remove, reached from home)
  ===================================================================== */
  function openLibrary(){
    draft.libraryOpen = true;
    go("playerSelect", {forLibraryOnly:true});
  }

  /* =====================================================================
     PLAYER SELECT
  ===================================================================== */
  function newSession(){
    resetDraft();
    draft.selected = [];
    go("playerSelect");
  }

  function viewPlayerSelect(){
    if(!draft.selected) draft.selected = [];
    var html = '';
    html += nav.forLibraryOnly ? topNavWithIcons("Users") : topNav("Wer spielt mit?");

    if(!nav.forLibraryOnly){
      html += '<p class="muted" style="margin-bottom:16px;">Wählt 4, 5, 6 oder 8 Spieler:innen aus der Bibliothek.</p>';
    }

    html += '<div class="card section">';
    if(!draft.pendingName){
      html += '<label class="field-label">Neue Person zur Bibliothek hinzufügen</label>' +
                '<div class="row" style="flex-wrap:nowrap;">' +
                  '<input type="text" id="newPlayerInput" placeholder="Name eingeben" maxlength="24">' +
                  '<button class="btn btn-secondary" data-action="proceedToAvatarPick">Weiter</button>' +
                '</div>';
    } else if(!draft.pendingAvatarId){
      html += '<label class="field-label">Avatar für '+escapeHtml(draft.pendingName)+' auswählen</label>';
      html += '<div class="avatar-grid">';
      AVATARS.forEach(function(av){
        var used = state.players.some(function(p){return p.avatarId===av.id;});
        html += '<button class="avatar-pick-btn" '+(used?'disabled':'')+' data-action="pickAvatar" data-id="'+av.id+'">' +
                  avatarImgTag(av, 40, used) +
                '</button>';
      });
      html += '</div>';
      html += '<button class="btn btn-ghost btn-block" style="margin-top:14px;" data-action="cancelAddPlayer">Abbrechen</button>';
    } else {
      html += '<label class="field-label">Spielen mit oder ohne Tichu-Mätteli?</label>';
      if(draft.matteliError){
        html += '<div class="warn-banner">🚫 Ohne Tichu-Mätteli beginnen wir keine Fallbesprechung. Bitte Haltung überdenken und "Mit Tichu-Mätteli" wählen.</div>';
      }
      html += '<div class="row">' +
                '<button class="btn btn-primary" data-action="answerMatteli" data-choice="mit">Mit Tichu-Mätteli</button>' +
                '<button class="btn btn-secondary" data-action="answerMatteli" data-choice="ohne">Ohne Tichu-Mätteli</button>' +
              '</div>';
      html += '<button class="btn btn-ghost btn-block" style="margin-top:14px;" data-action="cancelAddPlayer">Abbrechen</button>';
    }
    html += '</div>';

    html += '<div class="section"><h3 style="margin-bottom:12px;">'+(nav.forLibraryOnly?'Users':'Bibliothek')+'</h3>';
    if(state.players.length===0){
      html += '<div class="empty">Noch niemand in der Bibliothek. Fügt oben die erste Person hinzu.</div>';
    } else if(nav.forLibraryOnly){
      var libStats = state.sessions.length ? computeStatistics() : null;
      html += '<div class="user-grid">';

    if(mode===4){
      var m = createMatch(session, session.teams[0].id, session.teams[1].id, null);

        session.matches.push(createMatch(session, table2[0], table2[1], null, 1));

  function startFiveMatch(){
    var session = findSession(nav.sessionId);
    session.fiveSeedPairing = { a: draft.pairing.pairs[0].slice(), b: draft.pairing.pairs[1].slice(), pausing: session.sitOutOrder[0] };

  /* ----- 5-mode: derive the pairing for a given round index (0-based) ----- */
  function computeFiveRoundPairing(session, match, idx){
    var order = session.sitOutOrder;
    var pausing = order[idx % order.length];
    if(idx===0){
      var seed = session.fiveSeedPairing;
      return { a: seed.a.slice(), b: seed.b.slice(), pausing: pausing };
    }
    var prev = match.rounds[idx-1].pairing;
    var incoming = order[(idx-1) % order.length];
    var aHas = prev.a.indexOf(pausing)>=0;
    var newA = aHas ? prev.a.map(function(id){return id===pausing?incoming:id;}) : prev.a.slice();
    var newB = !aHas ? prev.b.map(function(id){return id===pausing?incoming:id;}) : prev.b.slice();
    return { a:newA, b:newB, pausing:pausing };
  }

  function matchPairing(session, match, idx){
    if(session.mode===5){ return computeFiveRoundPairing(session, match, idx); }
    var teamA = findTeam(session, match.teamA), teamB = findTeam(session, match.teamB);
    return { a: teamA.playerIds.slice(), b: teamB.playerIds.slice(), pausing: match.pausing };
  }

  function roundRobin4(teamIds){
    var t = teamIds;
    return [
      [[t[0],t[1]],[t[2],t[3]]],
      [[t[0],t[2]],[t[1],t[3]]],
      [[t[0],t[3]],[t[1],t[2]]]
    ];
  }
  function teamNames(session, teamId){
    var team = findTeam(session, teamId);
    return escapeHtml(team.playerIds.map(playerName).join(" & "));
  }

  function startEightRotationMatches(){
    var session = findSession(nav.sessionId);
    var pairing = roundRobin4(session.teams.map(function(t){return t.id;}))[session.cycle % 3];
    var m1 = createMatch(session, pairing[0][0], pairing[0][1], null, 0);
    var m2 = createMatch(session, pairing[1][0], pairing[1][1], null, 1);
    session.matches.push(m1, m2);
    save();
    go("match", {sessionId:session.id, matchId:m1.id});
  }

  function startNextEightRotationRound(session){
    go("matchIntro", {sessionId:session.id});
  }

  /* ----- 6-mode schedule ----- */
  function sixSchedule(teamIds){
    var t = teamIds; // [T1,T2,T3]
    return [
      {play:[t[0],t[1]], pause:t[2]},
      {play:[t[1],t[2]], pause:t[0]},
      {play:[t[0],t[2]], pause:t[1]}
    ];
  }
  function startNextSixMatch(session){
    var sched = sixSchedule(session.teams.map(function(t){return t.id;}))[session.cycle % 3];
    var m = createMatch(session, sched.play[0], sched.play[1], sched.pause);
    session.matches.push(m);
    save();
    go("match", {sessionId:session.id, matchId:m.id});
  }

  /* =====================================================================
     MATCH creation & core scoring
  ===================================================================== */
  function createMatch(session, teamAId, teamBId, pausingTeamOrPlayerId, tableIndex){
    return {
      id: uid(),
      teamA: teamAId,
      teamB: teamBId,
      pausing: pausingTeamOrPlayerId || null,
      table: (tableIndex===undefined?0:tableIndex),
      status: "active",
      scoreA: 0,
      scoreB: 0,
      rounds: []
    };
  }

  function recomputeMatchTotals(session, match){
    var a=0, b=0;
    match.rounds.forEach(function(r){ a += r.deltaA; b += r.deltaB; });
    match.scoreA = a; match.scoreB = b;
  }

  function recomputeIndividualScores(session){
    if(session.mode!==5) return;
    var totals = {};
    session.playerIds.forEach(function(id){ totals[id]=0; });
    session.matches.forEach(function(m){
      m.rounds.forEach(function(r){
        r.pairing.a.forEach(function(pid){ totals[pid]+=r.deltaA; });
        r.pairing.b.forEach(function(pid){ totals[pid]+=r.deltaB; });
      });
    });
    session.individualScores = totals;
  }

  /* =====================================================================
     MATCH SCREEN (round entry + history)
  ===================================================================== */
  function emptyRoundForm(session, match){
    var idx = match.rounds.length;
    var pairing = matchPairing(session, match, idx);
    var calls = {};
    pairing.a.concat(pairing.b).forEach(function(pid){ calls[pid] = {type:"none", success:null}; });
    return { calls: calls, ptsA:"", ptsB:"", doubleWin:null, pairing: pairing };
  }

  function viewMatch(){
    var session = findSession(nav.sessionId);
    var match = findMatch(session, nav.matchId);
    if(!draft.roundForm || draft.roundForm._matchId!==match.id){
      draft.roundForm = emptyRoundForm(session, match);
      draft.roundForm._matchId = match.id;
      draft.editingRoundId = null;
    }
    var f = draft.roundForm;

    var html = '';
    html += '<div class="topbar">' +
              '<button class="iconbtn" data-action="goHome">←</button>' +
              '<h2 style="flex:1; text-align:center;">'+matchTitle(session, match)+'</h2>' +
              '<button class="iconbtn" data-action="matchMenu">⋮</button>' +
            '</div>';

    if(session.mode===8){
      var others = session.matches.filter(function(m){return m.id!==match.id && m.status==="active";});
      if(others.length){
        html += '<div class="row section">';
        others.forEach(function(m){
          html += '<button class="btn btn-secondary" style="flex:1" data-action="switchTable" data-id="'+m.id+'">⇄ Zu Tisch '+(m.table+1)+' wechseln</button>';
        });
        html += '</div>';
      }
    }

    if(session.mode===5){
      html += '<div class="card section"><h3 style="margin-bottom:10px;">Punktestand</h3><table class="stat">';
      session.playerIds.forEach(function(pid){
        html += '<tr><td>'+nameWithAvatar(pid,20)+'</td><td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;">'+(session.individualScores[pid]||0)+'</td></tr>';
      });
      html += '</table></div>';
      html += '<div class="card card-gold section">' +
                '<p class="faint" style="margin-bottom:4px;">Runde '+(match.rounds.length+1)+(draft.editingRoundId?' (Bearbeitung)':'')+'</p>' +
                '<h3>'+f.pairing.a.map(function(pid){return nameWithAvatar(pid,22);}).join(' <span class="faint">&</span> ')+' <span class="faint">vs</span> '+f.pairing.b.map(function(pid){return nameWithAvatar(pid,22);}).join(' <span class="faint">&</span> ')+'</h3>' +
                '<p class="tag-pause" style="margin-top:6px;">⏸ Pause: '+nameWithAvatar(f.pairing.pausing,18)+'</p>' +
              '</div>';
      html += progressTile(session.playerIds.map(function(pid){
        return { label: nameWithAvatar(pid,18), value: session.individualScores[pid]||0, color: avatarColorForPlayer(pid) };
      }));
    } else {
      if(match.pausing){
        html += '<p class="tag-pause section">⏸ Pause: '+escapeHtml(teamNames(session, match.pausing))+'</p>';
      }
      html += '<div class="scorebar section">' +
                '<div class="score-side a"><div class="score-names">'+f.pairing.a.map(function(pid){return nameWithAvatar(pid,18);}).join(' <span class="faint">&</span> ')+'</div><div class="score-num">'+match.scoreA+'</div></div>' +
                '<div class="score-mid"></div>' +
                '<div class="score-side b"><div class="score-names">'+f.pairing.b.map(function(pid){return nameWithAvatar(pid,18);}).join(' <span class="faint">&</span> ')+'</div><div class="score-num">'+match.scoreB+'</div></div>' +
              '</div>';
      html += progressTile([
        { label: shortNameIds(f.pairing.a), value: match.scoreA, color: "var(--jade)" },
        { label: shortNameIds(f.pairing.b), value: match.scoreB, color: "var(--steel)" }
      ]);
    }

    html += renderRoundForm(session, match);

    html += '<div class="section"><h3 style="margin-bottom:8px;">Runden</h3>';
    if(match.rounds.length===0){
      html += '<div class="empty">Noch keine Runde gespeichert.</div>';
    } else {
      html += '<div class="grid">';
      match.rounds.slice().reverse().forEach(function(r){
        html += roundHistoryRow(session, match, r, false, match.rounds.indexOf(r)+1);
      });
      html += '</div>';
    }
    html += '</div>';

    return html;
  }

  function matchTitle(session, match){
    if(session.mode===4) return "Spiel";
    if(session.mode===5) return "Spiel";
    if(session.mode===6) return "Tichu-Turnier";
    if(session.mode===8) return "Tisch "+(match.table+1);
    return "Partie";
  }

  function switchTable(matchId){
    go("match", {sessionId:nav.sessionId, matchId:matchId});
  }

  function renderRoundForm(session, match){
    var f = draft.roundForm;
    var players = f.pairing.a.concat(f.pairing.b);
    var html = '<div class="card section" id="roundFormCard">';
    html += '<h3 style="margin-bottom:10px;">'+(draft.editingRoundId?"Runde bearbeiten":"Neue Runde")+'</h3>';

    html += '<div class="section">';
    players.forEach(function(pid){
      var side = f.pairing.a.indexOf(pid)>=0 ? 'a' : 'b';
      var c = f.calls[pid];
      html += '<div class="call-row">' +
                '<span class="call-name">'+nameWithAvatar(pid,20)+' <span class="call-side '+side+'">('+(side==='a'?'Team '+shortNameIds(f.pairing.a):'Team '+shortNameIds(f.pairing.b))+')</span></span>' +
                '<span class="seg" style="width:230px;">' +
                  '<button class="'+(c.type==='none'?'active':'')+'" data-action="setCallType" data-pid="'+pid+'" data-type="none">—</button>' +
                  '<button class="'+(c.type==='tichu'?'active':'')+'" data-action="setCallType" data-pid="'+pid+'" data-type="tichu">Tichu</button>' +
                  '<button class="'+(c.type==='grosses'?'active':'')+'" data-action="setCallType" data-pid="'+pid+'" data-type="grosses">Gr. Tichu</button>' +
                '</span>' +
              '</div>';
      if(c.type!=='none'){
        html += '<div style="display:flex; justify-content:flex-end; margin:-2px 0 8px;">' +
                  '<span class="seg" style="width:160px;">' +
                    '<button class="'+(c.success===true?'active':'')+'" data-action="setCallResult" data-pid="'+pid+'" data-result="true">Erfolg</button>' +
                    '<button class="'+(c.success===false?'active fail':'')+'" data-action="setCallResult" data-pid="'+pid+'" data-result="false">Gescheitert</button>' +
                  '</span>' +
                '</div>';
      }
    });
    html += '</div>';

    html += '<div class="divider"></div>';

    html += '<div class="dbl-row section">' +
              '<button class="dbl-btn'+(f.doubleWin==='A'?' on-a':'')+'" data-action="setDoubleWin" data-side="A">Doppelsieg '+shortNameIds(f.pairing.a)+'</button>' +
              '<button class="dbl-btn'+(f.doubleWin==='B'?' on-b':'')+'" data-action="setDoubleWin" data-side="B">Doppelsieg '+shortNameIds(f.pairing.b)+'</button>' +
            '</div>';

    if(!f.doubleWin){
      html += '<div class="points-row">' +
                '<div class="points-col"><label class="field-label">Kartenpunkte '+shortNameIds(f.pairing.a)+'</label>' +
                  '<div class="row" style="flex-wrap:nowrap; gap:6px;">' +
                    '<input type="text" inputmode="numeric" pattern="[0-9]*" id="ptsA" value="'+f.ptsA+'" placeholder="0" data-action="input-ptsA" style="flex:1;">' +
                    '<button type="button" class="btn btn-ghost" style="min-height:auto; padding:0 16px;" data-action="toggleSign" data-side="A">±</button>' +
                  '</div></div>' +
                '<div class="points-col"><label class="field-label">Kartenpunkte '+shortNameIds(f.pairing.b)+'</label>' +
                  '<div class="row" style="flex-wrap:nowrap; gap:6px;">' +
                    '<input type="text" inputmode="numeric" pattern="[0-9]*" id="ptsB" value="'+f.ptsB+'" placeholder="0" data-action="input-ptsB" style="flex:1;">' +
                    '<button type="button" class="btn btn-ghost" style="min-height:auto; padding:0 16px;" data-action="toggleSign" data-side="B">±</button>' +
                  '</div></div>' +
              '</div>';
      var a = parseInt(f.ptsA,10), b = parseInt(f.ptsB,10);
      if(f.ptsA!=="" && f.ptsB!==""){
        var sum = (isNaN(a)?0:a) + (isNaN(b)?0:b);
        if(sum===100){ html += '<div class="sum-check sum-ok">Summe '+sum+' — stimmt ✓</div>'; }
        else { html += '<div class="sum-check sum-bad">Summe '+sum+' — sollte 100 sein. Bitte prüfen.</div>'; }
      }
    } else {
      html += '<div class="faint" style="margin:6px 0 4px;">Kartenpunkte entfallen — Doppelsieg zählt automatisch 200 : 0.</div>';
    }

    var canSave = roundFormValid(f);
    html += '<div class="row section" style="margin-top:16px;">';
    if(draft.editingRoundId){
      html += '<button class="btn btn-ghost" data-action="cancelEditRound">Abbrechen</button>';
    }
    html += '<button class="btn btn-primary" style="flex:1" '+(canSave?'':'disabled')+' data-action="saveRound">'+(draft.editingRoundId?"Änderung speichern":"Runde speichern")+'</button>';
    html += '</div>';

    html += '</div>';
    return html;
  }

  function shortNameIds(ids){
    return ids.map(function(id){return playerName(id).split(" ")[0];}).join("/");
  }

  function roundFormValid(f){
    if(f.doubleWin) return true;
    if(f.ptsA==="" || f.ptsB==="") return false;
    var a = parseInt(f.ptsA,10), b=parseInt(f.ptsB,10);
    if(isNaN(a)||isNaN(b)) return false;
    if(a+b!==100) return false;
    return true;
  }

  function setCallType(pid, type){
    draft.roundForm.calls[pid] = {type:type, success:null};
    render();
  }
  function setCallResult(pid, result){
    var f = draft.roundForm;
    f.calls[pid].success = (result==="true");
    if(result==="true"){
      // nur eine Person kann pro Runde als Erste fertig sein — alle anderen Ansagen gelten dann automatisch als gescheitert
      Object.keys(f.calls).forEach(function(otherPid){
        if(otherPid===pid) return;
        var c = f.calls[otherPid];
        if(c.type!=="none"){ c.success = false; }
      });
    }
    render();
  }
  function setDoubleWin(side){
    var f = draft.roundForm;
    f.doubleWin = (f.doubleWin===side) ? null : side;
    render();
  }

  function bonusForSide(f, teamPlayerIds){
    var bonus = 0;
    teamPlayerIds.forEach(function(pid){
      var c = f.calls[pid];
      if(c.type==="none" || c.success===null) return;
      var val = c.type==="tichu" ? 100 : 200;
      bonus += c.success ? val : -val;
    });
    return bonus;
  }

  function saveRound(){
    var session = findSession(nav.sessionId);
    var match = findMatch(session, nav.matchId);
    var f = draft.roundForm;
    if(!roundFormValid(f)) return;

    var baseA, baseB;
    if(f.doubleWin==='A'){ baseA=200; baseB=0; }
    else if(f.doubleWin==='B'){ baseA=0; baseB=200; }
    else { baseA=parseInt(f.ptsA,10); baseB=parseInt(f.ptsB,10); }

    var bonusA = bonusForSide(f, f.pairing.a);
    var bonusB = bonusForSide(f, f.pairing.b);

    var round = {
      id: draft.editingRoundId || uid(),
      pairing: { a: f.pairing.a.slice(), b: f.pairing.b.slice(), pausing: f.pairing.pausing },
      calls: JSON.parse(JSON.stringify(f.calls)),
      doubleWin: f.doubleWin,
      basePointsA: baseA, basePointsB: baseB,
      bonusA: bonusA, bonusB: bonusB,
      deltaA: baseA+bonusA, deltaB: baseB+bonusB,
      ts: Date.now()
    };

    if(draft.editingRoundId){
      var idx = match.rounds.findIndex(function(r){return r.id===draft.editingRoundId;});
      match.rounds[idx] = round;
    } else {
      match.rounds.push(round);
    }
    recomputeMatchTotals(session, match);
    recomputeIndividualScores(session);
    save();

    draft.editingRoundId = null;
    draft.roundForm = emptyRoundForm(session, match);
    draft.roundForm._matchId = match.id;

    checkMatchEnd(session, match);
  }

  function checkMatchEnd(session, match){
    var ended = false;
    if(session.mode===5){
      var over = session.playerIds.filter(function(id){return (session.individualScores[id]||0) >= TARGET_SCORE;});
      if(over.length>0){ ended = true; }
    } else {
      if(match.scoreA>=TARGET_SCORE || match.scoreB>=TARGET_SCORE){ ended = true; }
    }
    if(ended){
      match.status = "completed";
      save();
      go("matchEnd", {sessionId:session.id, matchId:match.id});
    } else {
      render();
    }
  }

  function roundHistoryRow(session, match, r, readOnly, roundNum){
    var pairingLine = session.mode===5 ? (shortNameIds(r.pairing.a)+' vs '+shortNameIds(r.pairing.b)+' · '+playerName(r.pairing.pausing)+' pausiert') : null;

    var tiles = [];
    Object.keys(r.calls).forEach(function(pid){
      var c = r.calls[pid];
      if(c.type==="tichu" && c.success===true){ tiles.push('<span class="event-tile et-tichu">Tichu · '+escapeHtml(playerName(pid))+'</span>'); }
    });
    Object.keys(r.calls).forEach(function(pid){
      var c = r.calls[pid];
      if(c.type==="grosses" && c.success===true){ tiles.push('<span class="event-tile et-grosses">Gr. Tichu · '+escapeHtml(playerName(pid))+'</span>'); }
    });
    Object.keys(r.calls).forEach(function(pid){
      var c = r.calls[pid];
      if(c.type!=="none" && c.success===false){
        var lbl = (c.type==="tichu"?"Tichu":"Gr. Tichu")+" ✗ · "+playerName(pid);
        tiles.push('<span class="event-tile et-fail">'+escapeHtml(lbl)+'</span>');
      }
    });
    if(r.doubleWin){
      var side = r.doubleWin==='A' ? r.pairing.a : r.pairing.b;
      tiles.push('<span class="event-tile et-doublewin">Doppelsieg · '+escapeHtml(side.map(playerName).join(" & "))+'</span>');
    }

    return '<div class="round-tile" style="position:relative;">' +
             (roundNum ? '<p class="faint" style="text-align:center; margin-bottom:6px;">Runde '+roundNum+'</p>' : '') +
             '<div class="round-tile-score"><span class="rt-num">'+r.deltaA+'</span><span class="rt-sep">:</span><span class="rt-num">'+r.deltaB+'</span></div>' +
             (pairingLine ? '<p class="faint" style="text-align:center; margin:-4px 0 12px;">'+escapeHtml(pairingLine)+'</p>' : '') +
             (tiles.length ? '<div class="event-tiles">'+tiles.join('')+'</div>' : '') +
             (readOnly ? '' : '<button class="pencil" data-action="editRound" data-id="'+r.id+'" style="position:absolute; right:14px; top:50%; transform:translateY(-50%);">✎</button>') +
           '</div>';
  }

  function editRound(id){
    var session = findSession(nav.sessionId);
    var match = findMatch(session, nav.matchId);
    var r = match.rounds.find(function(rr){return rr.id===id;});
    draft.editingRoundId = id;
    draft.roundForm = {
      _matchId: match.id,
      pairing: { a: r.pairing.a.slice(), b: r.pairing.b.slice(), pausing: r.pairing.pausing },
      calls: JSON.parse(JSON.stringify(r.calls)),
      doubleWin: r.doubleWin,
      ptsA: r.doubleWin ? "" : String(r.basePointsA),
      ptsB: r.doubleWin ? "" : String(r.basePointsB)
    };
    render();
    var el = document.getElementById("roundFormCard");
    if(el && el.scrollIntoView){ try{ el.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){} }
  }
  function cancelEditRound(){
    var session = findSession(nav.sessionId);
    var match = findMatch(session, nav.matchId);
    draft.editingRoundId = null;
    draft.roundForm = emptyRoundForm(session, match);
    draft.roundForm._matchId = match.id;
    render();
  }

  function matchMenu(){
    confirmModal("Diese Partie abbrechen? Bisherige Runden bleiben im Spiel gespeichert.", function(){
      var session = findSession(nav.sessionId);
      var match = findMatch(session, nav.matchId);
      match.status = "aborted";
      save();
      closeModal();
      go("home");
    });
  }

  /* =====================================================================
     MATCH END
  ===================================================================== */
  function viewMatchEnd(){
    var session = findSession(nav.sessionId);
    var match = findMatch(session, nav.matchId);
    var teamA = findTeam(session, match.teamA), teamB = findTeam(session, match.teamB);
    var html = topNav("Partie beendet");

    if(session.mode===5){
      var winnerId = session.playerIds.slice().sort(function(a,b){return (session.individualScores[b]||0)-(session.individualScores[a]||0);})[0];
      html += '<div class="card card-gold section" style="text-align:center; padding:28px 18px;">' +
                '<p class="faint">Spiel gewonnen von</p>' +
                '<h1 style="margin:8px 0;">'+escapeHtml(playerName(winnerId))+'</h1>' +
                '<p class="muted">'+(session.individualScores[winnerId]||0)+' Punkte</p>' +
              '</div>';
      html += '<div class="section"><h3 style="margin-bottom:10px;">Punktestand</h3><table class="stat"><tr><th>Person</th><th>Punkte</th></tr>';
      session.playerIds.slice().sort(function(a,b){return (session.individualScores[b]||0)-(session.individualScores[a]||0);}).forEach(function(pid){
        html += '<tr><td>'+escapeHtml(playerName(pid))+'</td><td>'+(session.individualScores[pid]||0)+'</td></tr>';
      });
      html += '</table></div>';
      html += '<div class="section"><button class="btn btn-primary btn-block" data-action="finishSession">Spiel abschliessen</button></div>';
      html += '<div class="section"><button class="btn btn-ghost btn-block" data-action="backToMatchForEdit">↩ Fehler bei der Eingabe? Letzte Runde korrigieren</button></div>';
      return html;
    }

    var winA = match.scoreA>=TARGET_SCORE;
    html += '<div class="card card-gold section" style="text-align:center; padding:28px 18px;">' +
              '<p class="faint">Glückwunsch!</p>' +
              '<h1 style="margin:8px 0;">'+escapeHtml((winA?teamA:teamB).playerIds.map(playerName).join(" & "))+'</h1>' +
              '<p class="muted">'+match.scoreA+' : '+match.scoreB+'</p>' +
            '</div>';

    if(session.mode===4){
      html += '<div class="section"><button class="btn btn-primary btn-block" data-action="finishSession">Spiel abschliessen</button></div>';
    } else if(session.mode===6){
      html += '<div class="section"><button class="btn btn-primary btn-block" data-action="nextSixMatch">Nächste Partie</button></div>';
      html += '<div class="section"><button class="btn btn-ghost btn-block" data-action="finishSession">Spiel stattdessen beenden</button></div>';
    } else if(session.mode===8){
      var otherActive = session.matches.some(function(m){return m.id!==match.id && m.status==="active";});
      if(otherActive){
        html += '<p class="muted section">Der andere Tisch läuft noch weiter.</p>';
        html += '<div class="section"><button class="btn btn-primary btn-block" data-action="goHome">Zurück zur Übersicht</button></div>';
      } else if(session.eightRotation){
        html += '<div class="section"><button class="btn btn-primary btn-block" data-action="nextEightRotation">Nächste Runde (beide Tische)</button></div>';
        html += '<div class="section"><button class="btn btn-ghost btn-block" data-action="finishSession">Spiel stattdessen beenden</button></div>';
      } else {
        html += '<div class="section"><button class="btn btn-primary btn-block" data-action="restartFixedTable" data-table="'+match.table+'">Neue Partie an diesem Tisch</button></div>';
        html += '<div class="section"><button class="btn btn-ghost btn-block" data-action="finishSession">Spiel beenden</button></div>';
      }
    }
    html += '<div class="section"><button class="btn btn-ghost btn-block" data-action="backToMatchForEdit">↩ Fehler bei der Eingabe? Letzte Runde korrigieren</button></div>';
    return html;
  }

  function backToMatchForEdit(){
    go("match", {sessionId: nav.sessionId, matchId: nav.matchId});
  }

  function nextSixMatch(){
    var session = findSession(nav.sessionId);
    session.cycle = (session.cycle||0) + 1;
    save();
    startNextSixMatch(session);
  }
  function nextEightRotation(){
    var session = findSession(nav.sessionId);
    session.cycle = (session.cycle||0) + 1;
    save();
    startNextEightRotationRound(session);
  }
  function restartFixedTable(table){
    var session = findSession(nav.sessionId);
    var t = parseInt(table,10);
    var prevMatch = session.matches.slice().reverse().find(function(m){return m.table===t;});
    var m = createMatch(session, prevMatch.teamA, prevMatch.teamB, null, t);
    session.matches.push(m);
    save();
    go("match", {sessionId:session.id, matchId:m.id});
  }

  function finishSession(){
    var session = findSession(nav.sessionId);
    session.status = "completed";
    save();
    go("sessionSummary", {sessionId:session.id});
  }

  /* =====================================================================
     SESSION SUMMARY / OVERVIEW (also used when opening a session from home)
  ===================================================================== */
  function openSession(id){
    var session = findSession(id);
    if(session.status!=="active"){
      go("sessionSummary", {sessionId:id});
      return;
    }
    var activeMatch = session.matches.find(function(m){return m.status==="active";});
    if(activeMatch){
      go("match", {sessionId:id, matchId:activeMatch.id});
    } else {
      go("matchIntro", {sessionId:id});
    }
  }

  function viewSessionSummary(){
    var session = findSession(nav.sessionId);
    var html = topNav("Spiel-Übersicht");
    html += '<div class="card section">' +
              '<h3>'+session.mode+' Spieler · '+fmtDate(session.createdAt)+'</h3>' +
              '<p class="faint" style="margin-top:6px;">'+escapeHtml(session.playerIds.map(playerName).join(", "))+'</p>' +
              '<p class="faint" style="margin-top:6px;">Status: '+(session.status==="aborted"?"abgebrochen":"abgeschlossen")+'</p>' +
            '</div>';

    if(session.mode!==5){
      html += '<div class="section"><h3 style="margin-bottom:10px;">Partien</h3><p class="faint" style="margin-bottom:10px;">Auf eine Partie tippen für die Runden im Detail.</p><div class="grid">';
      session.matches.forEach(function(m){
        var teamA = findTeam(session, m.teamA), teamB = findTeam(session, m.teamB);

  var DEMO_NAMES = ["Sina","Timo","Ladina","Fabio","Priska","Res","Meret","Cyrill","Noemi","Beat"];

  function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pickN(arr, n){ return shuffle(arr).slice(0,n); }

  function demoRoundInputs(){
    var calls = {};
    var doubleWin = null;
    if(Math.random()<0.10){ doubleWin = Math.random()<0.5 ? 'A' : 'B'; }
    var baseA, baseB;
    if(doubleWin==='A'){ baseA=200; baseB=0; }
    else if(doubleWin==='B'){ baseA=0; baseB=200; }
    else { baseA = randomInt(0,20)*5; baseB = 100-baseA; }
    return { calls:calls, doubleWin:doubleWin, baseA:baseA, baseB:baseB };
  }

  function buildDemoRound(pairing){
    var ids = pairing.a.concat(pairing.b);
    var gen = demoRoundInputs();
    ids.forEach(function(pid){
      var r = Math.random();
      if(r<0.06){ gen.calls[pid] = {type:"grosses", success: Math.random()<0.5}; }
      else if(r<0.28){ gen.calls[pid] = {type:"tichu", success: Math.random()<0.6}; }
      else { gen.calls[pid] = {type:"none", success:null}; }
    });
    var bonusA = bonusForSide(gen, pairing.a);
    var bonusB = bonusForSide(gen, pairing.b);
    return {
      id: uid(),
      pairing: { a: pairing.a.slice(), b: pairing.b.slice(), pausing: pairing.pausing||null },
      calls: gen.calls,
      doubleWin: gen.doubleWin,
      basePointsA: gen.baseA, basePointsB: gen.baseB,
      bonusA: bonusA, bonusB: bonusB,
      deltaA: gen.baseA+bonusA, deltaB: gen.baseB+bonusB,
      ts: Date.now()
    };
  }

  function runDemoMatch(session, match, pairingFn, endCheckFn, outcome){
    var guard = 0;
    var abortAt = outcome==='aborted' ? randomInt(2,6) : null;
    var activeAt = outcome==='active' ? randomInt(3,8) : null;
    while(guard<80){
      var idx = match.rounds.length;
      var pairing = pairingFn(idx);
      match.rounds.push(buildDemoRound(pairing));
      recomputeMatchTotals(session, match);
      guard++;
      if(abortAt && guard>=abortAt){ match.status='aborted'; return 'aborted'; }
      if(activeAt && guard>=activeAt){ match.status='active'; return 'active'; }
      if(endCheckFn(session, match)){ match.status='completed'; return 'completed'; }
    }
    match.status='completed';
    return 'completed';
  }

  var demoTeamEndCheck = function(s,m){ return m.scoreA>=TARGET_SCORE || m.scoreB>=TARGET_SCORE; };

  function genMode4Session(pool, createdAt, outcome){
    var ids = pickN(pool,4);
    var sh = shuffle(ids);
    var teamA = {id:uid(), playerIds:[sh[0],sh[1]]};
    var teamB = {id:uid(), playerIds:[sh[2],sh[3]]};
    var session = {id:uid(), createdAt:createdAt, mode:4, playerIds:ids, eightRotation:false, status:"active", teams:[teamA,teamB], matches:[], demo:true};
    var match = createMatch(session, teamA.id, teamB.id, null);
    session.matches.push(match);
    var pairingFn = function(){ return {a:teamA.playerIds, b:teamB.playerIds, pausing:null}; };
    var result = runDemoMatch(session, match, pairingFn, demoTeamEndCheck, outcome);
    session.status = result;
    return session;
  }

  function genMode6Session(pool, createdAt, outcome){
    var ids = pickN(pool,6);
    var sh = shuffle(ids);
    var teams = [
      {id:uid(), playerIds:[sh[0],sh[1]]},
      {id:uid(), playerIds:[sh[2],sh[3]]},
      {id:uid(), playerIds:[sh[4],sh[5]]}
    ];
    var session = {id:uid(), createdAt:createdAt, mode:6, playerIds:ids, eightRotation:false, status:"active", teams:teams, matches:[], cycle:0, demo:true};
    var sched = sixSchedule(teams.map(function(t){return t.id;}));
    var numMatches = randomInt(1,3);
    var finalOutcome = 'completed';
    for(var i=0;i<numMatches;i++){
      var s = sched[i%3];
      var match = createMatch(session, s.play[0], s.play[1], s.pause);
      session.matches.push(match);
      var teamAref = findTeam(session, match.teamA), teamBref = findTeam(session, match.teamB);
      var pairingFn = (function(ta,tb,pause){ return function(){ return {a:ta.playerIds, b:tb.playerIds, pausing:pause}; }; })(teamAref, teamBref, match.pausing);
      var isLast = (i===numMatches-1);
      var result = runDemoMatch(session, match, pairingFn, demoTeamEndCheck, isLast?outcome:'completed');
      if(result!=='completed'){ finalOutcome = result; break; }
    }
    session.status = finalOutcome;
    return session;
  }

  function genMode8Session(pool, createdAt, outcome){
    var ids = pickN(pool,8);
    var sh = shuffle(ids);
    var teams = [0,1,2,3].map(function(i){ return {id:uid(), playerIds:[sh[i*2],sh[i*2+1]]}; });
    var rotation = Math.random()<0.5;
    var session = {id:uid(), createdAt:createdAt, mode:8, playerIds:ids, eightRotation:rotation, status:"active", teams:teams, matches:[], cycle:0, demo:true};
    var finalOutcome = 'completed';

    if(!rotation){
      var m1 = createMatch(session, teams[0].id, teams[1].id, null, 0);
      var m2 = createMatch(session, teams[2].id, teams[3].id, null, 1);
      session.matches.push(m1, m2);
      var pair = [m1,m2];
      for(var k=0;k<2;k++){
        var m = pair[k];
        var ta = findTeam(session, m.teamA), tb = findTeam(session, m.teamB);
        var pairingFn = (function(ta2,tb2){ return function(){ return {a:ta2.playerIds, b:tb2.playerIds, pausing:null}; }; })(ta,tb);
        var thisOutcome = (k===1) ? outcome : 'completed';
        var result = runDemoMatch(session, m, pairingFn, demoTeamEndCheck, thisOutcome);
        if(result!=='completed'){ finalOutcome = result; }
      }
    } else {
      var rr = roundRobin4(teams.map(function(t){return t.id;}));
      var numRounds = randomInt(1,3);
      outer:
      for(var i=0;i<numRounds;i++){
        var pairing2 = rr[i%3];
        var m1b = createMatch(session, pairing2[0][0], pairing2[0][1], null, 0);
        var m2b = createMatch(session, pairing2[1][0], pairing2[1][1], null, 1);
        session.matches.push(m1b, m2b);
        var isLastRound = (i===numRounds-1);
        var pair2 = [m1b, m2b];
        for(var j=0;j<2;j++){
          var mm = pair2[j];
          var ta2 = findTeam(session, mm.teamA), tb2 = findTeam(session, mm.teamB);
          var pairingFn2 = (function(ta3,tb3){ return function(){ return {a:ta3.playerIds, b:tb3.playerIds, pausing:null}; }; })(ta2,tb2);
          var thisOutcome2 = (isLastRound && j===1) ? outcome : 'completed';
          var res = runDemoMatch(session, mm, pairingFn2, demoTeamEndCheck, thisOutcome2);
          if(res!=='completed'){ finalOutcome = res; break outer; }
        }
      }
    }
    session.status = finalOutcome;
    return session;
  }

  function genMode5Session(pool, createdAt, outcome){
    var ids = pickN(pool,5);
    var order = shuffle(ids);
    var activeFirst = shuffle(order.slice(1));
    var seed = { a:[activeFirst[0],activeFirst[1]], b:[activeFirst[2],activeFirst[3]], pausing: order[0] };
    var session = {id:uid(), createdAt:createdAt, mode:5, playerIds:ids, sitOutOrder:order, status:"active", teams:[], matches:[], fiveSeedPairing:seed, individualScores:{}, demo:true};
    ids.forEach(function(id){ session.individualScores[id]=0; });
    var match = createMatch(session, null, null, null);
    session.matches.push(match);
    var pairingFn = function(idx){ return computeFiveRoundPairing(session, match, idx); };
    var endCheck = function(s,m){
      recomputeIndividualScores(s);
      return s.playerIds.some(function(id){ return (s.individualScores[id]||0) >= TARGET_SCORE; });
    };
    var result = runDemoMatch(session, match, pairingFn, endCheck, outcome);
    recomputeIndividualScores(session);
    session.status = result;
    return session;
  }

  function generateDemoData(){
    var usedAvatars = state.players.filter(function(p){return p.avatarId;}).map(function(p){return p.avatarId;});

    state.players = state.players.concat(demoPlayers);
    var ids = demoPlayers.map(function(p){return p.id;});

    var sessions = [];
    var modes = [4,5,6,8];
    var specialOutcomes = ['aborted','active','aborted','active'];
    modes.forEach(function(mode, mi){
      for(var i=0;i<5;i++){
        var createdAt = now - randomInt(0,55)*86400000 - randomInt(0,80000000);
        var outcome = (i===4) ? specialOutcomes[mi] : 'completed';
        var session;
        if(mode===4) session = genMode4Session(ids, createdAt, outcome);
        else if(mode===5) session = genMode5Session(ids, createdAt, outcome);

        else session = genMode8Session(ids, createdAt, outcome);
        sessions.push(session);
      }

    state.sessions = state.sessions.concat(sessions);
    state.demoActive = true;
    save();
