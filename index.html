  /* =====================================================================
     STATISTICS
  ===================================================================== */
  function newPlayerAgg(){
    return {
      roundsPlayed: 0, totalDelta: 0,
      tichuCalled:0, tichuSuccess:0, grossesCalled:0, grossesSuccess:0,
      failCount:0, failPenaltySum:0,
      doubleWins:0, lastMinuteHeroes:0,
      minScoreEver: 0,
      swings: [],
      trendDiffs: [],
      contests: {} // mode -> {w,t}
    };
  }

  function computeStatistics(){
    var P = {}; // playerId -> agg
    function ensure(pid){ if(!P[pid]) P[pid] = newPlayerAgg(); return P[pid]; }
    var pairStats = {};    // "id1|id2" -> {ids, won, total}
    var matchupStats = {}; // "keyA::keyB" -> {aIds,bIds,aKey,bKey,aWon,bWon,total}
    var marathon = [];     // {mode, sessionId, date, rounds}
    var lastMinuteHeroList = []; // {pids, mode, sessionId, date, oppScoreBefore}

    function recordContest(pid, mode, won){
      var p = ensure(pid);
      if(!p.contests[mode]) p.contests[mode] = {w:0,t:0};
      p.contests[mode].t++;
      if(won) p.contests[mode].w++;
    }

    state.sessions.forEach(function(session){
      var sessionTimeline = {}; // pid -> [{delta}] in chronological order, this session only
      session.playerIds.forEach(function(pid){ ensure(pid); sessionTimeline[pid] = []; });

      session.matches.forEach(function(match){
        marathon.push({ mode:session.mode, sessionId:session.id, date:session.createdAt, rounds:match.rounds.length });

        var runA=0, runB=0, minA=0,maxA=0,minB=0,maxB=0;

        match.rounds.forEach(function(r){
          var idsA = r.pairing.a, idsB = r.pairing.b;
          idsA.concat(idsB).forEach(ensure);

          idsA.forEach(function(pid){ P[pid].roundsPlayed++; P[pid].totalDelta += r.deltaA; sessionTimeline[pid].push(r.deltaA); });
          idsB.forEach(function(pid){ P[pid].roundsPlayed++; P[pid].totalDelta += r.deltaB; sessionTimeline[pid].push(r.deltaB); });

          Object.keys(r.calls).forEach(function(pid){
            var c = r.calls[pid];
            if(!c || c.type==='none') return;
            var p = ensure(pid);
            if(c.type==='tichu'){
              p.tichuCalled++;
              if(c.success){ p.tichuSuccess++; } else { p.failCount++; p.failPenaltySum+=100; }
            } else {
              p.grossesCalled++;
              if(c.success){ p.grossesSuccess++; } else { p.failCount++; p.failPenaltySum+=200; }
            }
          });

          if(r.doubleWin){
            var winSide = r.doubleWin==='A' ? idsA : idsB;
            var oppBefore = r.doubleWin==='A' ? runB : runA;
            winSide.forEach(function(pid){
              P[pid].doubleWins++;
              if(oppBefore>=700){
                P[pid].lastMinuteHeroes++;
                lastMinuteHeroList.push({pid:pid, mode:session.mode, sessionId:session.id, date:session.createdAt, oppBefore:oppBefore});
              }
            });
          }

          var keyA = idsA.slice().sort().join('|'), keyB = idsB.slice().sort().join('|');
          if(keyA && keyB && idsA.length===2 && idsB.length===2){
            if(!pairStats[keyA]) pairStats[keyA] = {ids:idsA, won:0, total:0};
            if(!pairStats[keyB]) pairStats[keyB] = {ids:idsB, won:0, total:0};
            pairStats[keyA].total++; pairStats[keyB].total++;
            if(r.deltaA>r.deltaB) pairStats[keyA].won++;
            else if(r.deltaB>r.deltaA) pairStats[keyB].won++;

            var lo = keyA<keyB ? keyA : keyB, hi = keyA<keyB ? keyB : keyA;
            var mkey = lo+'::'+hi;
            if(!matchupStats[mkey]){
              matchupStats[mkey] = { aIds: lo===keyA?idsA:idsB, bIds: lo===keyA?idsB:idsA, aKey:lo, bKey:hi, aWon:0, bWon:0, total:0 };
            }
            matchupStats[mkey].total++;
            if(r.deltaA>r.deltaB){ if(keyA===matchupStats[mkey].aKey) matchupStats[mkey].aWon++; else matchupStats[mkey].bWon++; }
            else if(r.deltaB>r.deltaA){ if(keyB===matchupStats[mkey].aKey) matchupStats[mkey].aWon++; else matchupStats[mkey].bWon++; }
          }

          runA+=r.deltaA; runB+=r.deltaB;
          minA=Math.min(minA,runA); maxA=Math.max(maxA,runA);
          minB=Math.min(minB,runB); maxB=Math.max(maxB,runB);
        });

        if(session.mode!==5 && match.rounds.length>0){
          var teamA = findTeam(session, match.teamA), teamB = findTeam(session, match.teamB);
          if(teamA) teamA.playerIds.forEach(function(pid){ ensure(pid).swings.push({value:maxA-minA, mode:session.mode, sessionId:session.id, date:session.createdAt}); });
          if(teamB) teamB.playerIds.forEach(function(pid){ ensure(pid).swings.push({value:maxB-minB, mode:session.mode, sessionId:session.id, date:session.createdAt}); });
        }

        if(session.mode!==5 && match.status==='completed' && match.scoreA!==match.scoreB){
          var ta = findTeam(session, match.teamA), tb = findTeam(session, match.teamB);
          var winners = match.scoreA>match.scoreB ? ta.playerIds : tb.playerIds;
          var losers = match.scoreA>match.scoreB ? tb.playerIds : ta.playerIds;
          winners.forEach(function(pid){ recordContest(pid, session.mode, true); });
          losers.forEach(function(pid){ recordContest(pid, session.mode, false); });
        }
      });

      if(session.mode===5 && session.matches[0]){
        var running = {}, minSeen = {}, maxSeen = {};
        session.playerIds.forEach(function(id){ running[id]=0; minSeen[id]=0; maxSeen[id]=0; });
        session.matches[0].rounds.forEach(function(r){
          r.pairing.a.forEach(function(pid){ running[pid]+=r.deltaA; minSeen[pid]=Math.min(minSeen[pid],running[pid]); maxSeen[pid]=Math.max(maxSeen[pid],running[pid]); });
          r.pairing.b.forEach(function(pid){ running[pid]+=r.deltaB; minSeen[pid]=Math.min(minSeen[pid],running[pid]); maxSeen[pid]=Math.max(maxSeen[pid],running[pid]); });
        });
        session.playerIds.forEach(function(pid){
          var p = ensure(pid);
          p.minScoreEver = Math.min(p.minScoreEver, minSeen[pid]);
          p.swings.push({value:maxSeen[pid]-minSeen[pid], mode:5, sessionId:session.id, date:session.createdAt});
        });
        if(session.status==='completed'){
          var finalScores = session.individualScores || {};
          var winnerId = session.playerIds.slice().sort(function(a,b){return (finalScores[b]||0)-(finalScores[a]||0);})[0];
          session.playerIds.forEach(function(pid){ recordContest(pid, 5, pid===winnerId); });
        }
      }

      session.playerIds.forEach(function(pid){
        var seq = sessionTimeline[pid];
        if(seq.length>=4){
          var half = Math.floor(seq.length/2);
          var first = seq.slice(0,half), second = seq.slice(seq.length-half);
          var avg = function(a){ return a.reduce(function(s,v){return s+v;},0)/a.length; };
          P[pid].trendDiffs.push(avg(second)-avg(first));
        }
      });
    });

    return { players:P, pairStats:pairStats, matchupStats:matchupStats, marathon:marathon, lastMinuteHeroList:lastMinuteHeroList };
  }

  function pct(w,t){ return t>0 ? Math.round((w/t)*100) : 0; }

  function buildStatCategories(S, limit){
    var P = S.players;
    var ids = Object.keys(P);
    function nm(id){ return playerName(id); }
    function cap(rows){ return limit ? rows.slice(0,limit) : rows; }
    var cats = [];

    // ---- Ehrentafel mit Augenzwinkern (always first) ----
    cats.push({ title:"🎭 Grössenwahn-Index", subtitle:"Meiste gescheiterte Grosse Tichus", rows: cap(
      ids.filter(function(id){ return P[id].grossesCalled>=1; })
        .map(function(id){ return {id:id, fails:P[id].grossesCalled-P[id].grossesSuccess, c:P[id].grossesCalled}; })
        .sort(function(a,b){ return b.fails-a.fails || b.c-a.c; })
        .map(function(r){ return [nm(r.id), r.fails+"/"+r.c, r.id]; })
    )});

    cats.push({ title:"🏮 Rote Laterne", subtitle:"Tiefster je erreichter Punktestand (5er-Modus)", rows: cap(
      ids.filter(function(id){ return P[id].minScoreEver<0; })
        .sort(function(a,b){ return P[a].minScoreEver-P[b].minScoreEver; })
        .map(function(id){ return [nm(id), P[id].minScoreEver+" Pkt.", id]; })
    )});

    cats.push({ title:"💸 Bankrott-Garantie", subtitle:"Ø verlorene Punkte pro gescheiterter Ansage, ab 2x", rows: cap(
      ids.filter(function(id){ return P[id].failCount>=2; })
        .map(function(id){ return {id:id, avg:P[id].failPenaltySum/P[id].failCount, c:P[id].failCount}; })
        .sort(function(a,b){ return b.avg-a.avg; })
        .map(function(r){ return [nm(r.id), "-"+Math.round(r.avg)+" Ø ("+r.c+")", r.id]; })
    )});

    cats.push({ title:"💪 Nervenstärke", subtitle:"Höchste Ansage-Erfolgsquote, ab 2 Ansagen", rows: cap(
      ids.filter(function(id){ return (P[id].tichuCalled+P[id].grossesCalled)>=2; })
        .map(function(id){ var c=P[id].tichuCalled+P[id].grossesCalled, s=P[id].tichuSuccess+P[id].grossesSuccess; return {id:id, q:pct(s,c), c:c}; })
        .sort(function(a,b){ return b.q-a.q || b.c-a.c; })
        .map(function(r){ return [nm(r.id), r.q+"% bei "+r.c+" Ansagen", r.id]; })
    )});

    var allSwings = [];
    ids.forEach(function(id){ P[id].swings.forEach(function(s){ allSwings.push({id:id, value:s.value, date:s.date}); }); });
    cats.push({ title:"🎢 Wundertüte des Abends", subtitle:"Grösste Punkte-Spanne (Höchst- minus Tiefststand) in einer Partie", rows: cap(
      allSwings.sort(function(a,b){ return b.value-a.value; })
        .map(function(s){ return [nm(s.id)+" · "+fmtDate(s.date).split(' · ')[0], s.value+" Pkt.", s.id]; })
    )});

    cats.push({ title:"🙈 Angsthase", subtitle:"Seltenste Tichu-Ansagen pro gespielter Runde, ab 5 Runden", rows: cap(
      ids.filter(function(id){ return P[id].roundsPlayed>=5; })
        .map(function(id){ return {id:id, rate:(P[id].tichuCalled+P[id].grossesCalled)/P[id].roundsPlayed}; })
        .sort(function(a,b){ return a.rate-b.rate; })
        .map(function(r){ return [nm(r.id), (r.rate*100).toFixed(0)+"%", r.id]; })
    )});

    cats.push({ title:"⚔️ Nemesis-Paarungen", subtitle:"Häufigste Duo-Duelle, ab 3 gemeinsamen Runden", rows: cap(
      Object.keys(S.matchupStats).map(function(k){ return S.matchupStats[k]; })
        .filter(function(m){ return m.total>=3; })
        .sort(function(a,b){ return b.total-a.total; })
        .map(function(m){
          var aName = m.aIds.map(nm).join("/"), bName = m.bIds.map(nm).join("/");
          var lead = m.aWon>=m.bWon ? aName : bName;
          return [aName+" vs "+bName, m.aWon+":"+m.bWon];
        })
    )});

    cats.push({ title:"🏃 Marathon-Partie", subtitle:"Meiste Runden in einer einzelnen Partie", rows: cap(
      S.marathon.filter(function(m){ return m.rounds>0; })
        .sort(function(a,b){ return b.rounds-a.rounds; })
        .map(function(m){ return [m.mode+" Spieler · "+fmtDate(m.date).split(' · ')[0], m.rounds+" Runden"]; })
    )});

    cats.push({ title:"🦸 Last-Minute-Held", subtitle:"Doppelsieg geholt, als der Gegner bei ≥700 Punkten stand", rows: cap(
      ids.filter(function(id){ return P[id].lastMinuteHeroes>0; })
        .sort(function(a,b){ return P[b].lastMinuteHeroes-P[a].lastMinuteHeroes; })
        .map(function(id){ return [nm(id), P[id].lastMinuteHeroes+"x", id]; })
    )});

    var trendRows1 = ids.filter(function(id){ return P[id].trendDiffs.length>=2; })
      .map(function(id){ return {id:id, avg: P[id].trendDiffs.reduce(function(s,v){return s+v;},0)/P[id].trendDiffs.length}; });
    cats.push({ title:"🌙 Spätzünder", subtitle:"Legt in der zweiten Spielhälfte am meisten zu, ab 2 Spielen", rows: cap(
      trendRows1.slice().sort(function(a,b){ return b.avg-a.avg; })
        .map(function(r){ return [nm(r.id), (r.avg>=0?"+":"")+r.avg.toFixed(0)+" Pkt. 2. Hälfte", r.id]; })
    )});
    cats.push({ title:"🌅 Frühstarter", subtitle:"Lässt gegen Spielende am meisten nach, ab 2 Spielen", rows: cap(
      trendRows1.slice().sort(function(a,b){ return a.avg-b.avg; })
        .map(function(r){ return [nm(r.id), r.avg.toFixed(0)+" Pkt. 2. Hälfte", r.id]; })
    )});

    // ---- Bestenlisten (always after Ehrentafel) ----
    [4,5,6,8].forEach(function(mode){
      cats.push({ title:"Siegquote — "+mode+" Spieler", subtitle:(mode===5?"Individuell":"Partien")+", ab 2 Partien", rows: cap(
        ids.filter(function(id){ return P[id].contests[mode] && P[id].contests[mode].t>=2; })
          .map(function(id){ var c=P[id].contests[mode]; return {id:id, w:c.w, t:c.t, q:pct(c.w,c.t)}; })
          .sort(function(a,b){ return b.q-a.q || b.t-a.t; })
          .map(function(r){ return [nm(r.id), r.q+"% ("+r.w+"/"+r.t+")", r.id]; })
      )});
    });

    cats.push({ title:"Tichu-Erfolgsquote", subtitle:"Normales Tichu, ab 2 Ansagen", rows: cap(
      ids.filter(function(id){ return P[id].tichuCalled>=2; })
        .map(function(id){ return {id:id, q:pct(P[id].tichuSuccess,P[id].tichuCalled), c:P[id].tichuCalled, s:P[id].tichuSuccess}; })
        .sort(function(a,b){ return b.q-a.q || b.c-a.c; })
        .map(function(r){ return [nm(r.id), r.q+"% ("+r.s+"/"+r.c+")", r.id]; })
    )});

    cats.push({ title:"Grosses-Tichu-Erfolgsquote", subtitle:"Ab 1 Ansage", rows: cap(
      ids.filter(function(id){ return P[id].grossesCalled>=1; })
        .map(function(id){ return {id:id, q:pct(P[id].grossesSuccess,P[id].grossesCalled), c:P[id].grossesCalled, s:P[id].grossesSuccess}; })
        .sort(function(a,b){ return b.q-a.q || b.c-a.c; })
        .map(function(r){ return [nm(r.id), r.q+"% ("+r.s+"/"+r.c+")", r.id]; })
    )});

    cats.push({ title:"Bestes Duo", subtitle:"Runden-Siegquote als Team, ab 3 gemeinsamen Runden", rows: cap(
      Object.keys(S.pairStats).map(function(k){ return S.pairStats[k]; })
        .filter(function(p){ return p.total>=3; })
        .map(function(p){ return {ids:p.ids, q:pct(p.won,p.total), w:p.won, t:p.total}; })
        .sort(function(a,b){ return b.q-a.q || b.t-a.t; })
        .map(function(r){ return [r.ids.map(nm).join(" & "), r.q+"% ("+r.w+"/"+r.t+")"]; })
    )});

    cats.push({ title:"Punkteschnitt pro Runde", subtitle:"Ø Rundenertrag der eigenen Seite, ab 5 Runden", rows: cap(
      ids.filter(function(id){ return P[id].roundsPlayed>=5; })
        .map(function(id){ return {id:id, avg: (P[id].totalDelta/P[id].roundsPlayed)}; })
        .sort(function(a,b){ return b.avg-a.avg; })
        .map(function(r){ return [nm(r.id), (r.avg>=0?"+":"")+r.avg.toFixed(1), r.id]; })
    )});

    cats.push({ title:"Aktivste Person", subtitle:"Gespielte Runden insgesamt", rows: cap(
      ids.slice().sort(function(a,b){ return P[b].roundsPlayed-P[a].roundsPlayed; })
        .map(function(id){ return [nm(id), P[id].roundsPlayed+" Runden", id]; })
    )});

    return cats;
  }

  function statLeaderboard(cat){
    var html = '<div class="card section"><h3 style="margin-bottom:2px;">'+cat.title+'</h3>';
    if(cat.subtitle) html += '<p class="faint" style="margin-bottom:10px;">'+cat.subtitle+'</p>';
    if(cat.rows.length===0){
      html += '<p class="faint">Noch nicht genug Daten.</p>';
    } else {
      html += '<table class="stat">';
      cat.rows.forEach(function(row){
        var label = row[2] ? '<span class="avatar-inline">'+avatarForPlayer(row[2],20)+'<span>'+escapeHtml(row[0])+'</span></span>' : escapeHtml(row[0]);
        html += '<tr><td>'+label+'</td><td style="text-align:right; font-variant-numeric:tabular-nums; font-weight:700;">'+row[1]+'</td></tr>';
      });
      html += '</table>';
    }
    html += '</div>';
    return html;
  }

  function viewStats(){
    var html = topNavWithIcons("Statistiken");
    if(state.sessions.length===0){
      html += '<div class="empty">Noch keine Spiele gespielt — sobald ihr loslegt (oder Testdaten aktiviert), erscheinen hier Auswertungen.</div>';
      return html;
    }
    var S = computeStatistics();
    var cats = buildStatCategories(S, 5);
    html += '<div class="stats-grid section">';
    cats.forEach(function(cat){ html += statLeaderboard(cat); });
    html += '</div>';
    return html;
  }

  function statsHomeBlock(){
    if(state.sessions.length===0) return '';
    var S = computeStatistics();
    var cats = buildStatCategories(S, 3).filter(function(c){ return c.rows.length>0; });
    if(cats.length===0) return '';
    var html = '<div class="section"><h2 style="margin-bottom:12px;">Statistiken</h2>';
    html += '<div class="stats-grid">';
    cats.forEach(function(cat){ html += statLeaderboard(cat); });
    html += '</div>';
    html += '<button class="btn btn-secondary btn-block" style="margin-top:14px;" data-action="openStats">Alle Statistiken ansehen →</button>';
    html += '</div>';
    return html;
  }

  function exportData(){
    var payload = JSON.stringify(state, null, 2);
    var blob = new Blob([payload], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "tichu-sicherung-"+dateStr+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
  }

  function triggerImport(){
    var input = document.getElementById("importFileInput");
    if(input) input.click();
  }

  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ alert("Diese Datei ist keine gültige Sicherungsdatei (kein lesbares JSON)."); return; }
      if(!parsed || !Array.isArray(parsed.players) || !Array.isArray(parsed.sessions)){
        alert("Diese Datei hat nicht das erwartete Format einer Tichu-Sicherung.");
        return;
      }
      confirmModal("Import wirklich durchführen? Alle auf diesem Gerät aktuell gespeicherten Spieler, Spiele und Statistiken werden dabei ersetzt und gehen unwiderruflich verloren.", function(){
        state = {
          players: parsed.players,
          sessions: parsed.sessions,
          demoActive: !!parsed.demoActive
        };
        save();
        closeModal();
        resetDraft();
        go("home");
      });
    };
    reader.readAsText(file);
  }

  /* =====================================================================
     GLOBAL ACTIONS
  ===================================================================== */
  function goHome(){ resetDraft(); go("home"); }

  var actions = {
    openLibrary: openLibrary,
    newSession: newSession,
    openSession: function(el){ openSession(el.getAttribute("data-id")); },
    deleteSession: function(el){ deleteSession(el.getAttribute("data-id")); },
    proceedToAvatarPick: proceedToAvatarPick,
    pickAvatar: function(el){ pickAvatar(el.getAttribute("data-id")); },
    answerMatteli: function(el){ answerMatteli(el.getAttribute("data-choice")); },
    cancelAddPlayer: cancelAddPlayer,
    removePlayer: function(el){ removePlayer(el.getAttribute("data-id")); },
    renamePlayer: function(el){ renamePlayer(el.getAttribute("data-id")); },
    togglePlayer: function(el){ togglePlayer(el.getAttribute("data-id")); },
    confirmPlayerSelect: confirmPlayerSelect,
    setEightMode: function(el){ setEightMode(el.getAttribute("data-val")); },
    goTeamSetup: goTeamSetup,
    randomPairs: randomPairs,
    resetPairs: resetPairs,
    pickForPair: function(el){ pickForPair(el.getAttribute("data-id")); },
    removePair: function(el){ removePair(parseInt(el.getAttribute("data-idx"),10)); },
    setTable: function(el){ setTable(el.getAttribute("data-idx"), el.getAttribute("data-t")); },
    confirmTeamSetup: confirmTeamSetup,
    moveOrder: function(el){ moveOrder(el.getAttribute("data-idx"), el.getAttribute("data-dir")); },
    shuffleOrder: shuffleOrder,
    confirmSitOutOrder: confirmSitOutOrder,
    pickForPairIntro: function(el){ pickForPairIntro(el.getAttribute("data-id")); },
    removePairIntro: function(el){ removePairIntro(parseInt(el.getAttribute("data-idx"),10)); },
    resetPairsIntro: resetPairsIntro,
    randomPairsIntro: randomPairsIntro,
    startFiveMatch: startFiveMatch,
    startEightRotationMatches: startEightRotationMatches,
    setCallType: function(el){ setCallType(el.getAttribute("data-pid"), el.getAttribute("data-type")); },
    setCallResult: function(el){ setCallResult(el.getAttribute("data-pid"), el.getAttribute("data-result")); },
    setDoubleWin: function(el){ setDoubleWin(el.getAttribute("data-side")); },
    toggleSign: function(el){ toggleSign(el.getAttribute("data-side")); },
    saveRound: saveRound,
    editRound: function(el){ editRound(el.getAttribute("data-id")); },
    cancelEditRound: cancelEditRound,
    matchMenu: matchMenu,
    nextSixMatch: nextSixMatch,
    nextEightRotation: nextEightRotation,
    restartFixedTable: function(el){ restartFixedTable(el.getAttribute("data-table")); },
    switchTable: function(el){ switchTable(el.getAttribute("data-id")); },
    finishSession: finishSession,
    goHome: goHome,
    toggleDemo: toggleDemo,
    openStats: function(){ go("stats"); },
    openAllSessions: function(){ go("allSessions"); },
    openMatchHistory: function(el){ openMatchHistory(el.getAttribute("data-id")); },
    backToSessionSummary: backToSessionSummary,
    backToMatchForEdit: backToMatchForEdit,
    exportData: exportData,
    triggerImport: triggerImport
  };

  document.addEventListener("click", function(e){
    if(e.target.closest("[data-close-modal]") && e.target.hasAttribute("data-close-modal")){
      closeModal(); return;
    }
    if(e.target.closest("[data-modal-cancel]")){ closeModal(); return; }
    if(e.target.closest("[data-modal-confirm]")){
      if(modalState && modalState.onYes) modalState.onYes();
      return;
    }
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    if(action.indexOf("input-")===0) return;
    if(actions[action]) actions[action](el);
  });

  document.addEventListener("input", function(e){
    if(e.target.id==="ptsA"){
      var vA = sanitizeSignedInt(e.target.value);
      draft.roundForm.ptsA = vA;
      var nA = parseInt(vA,10);
      if(!isNaN(nA)) draft.roundForm.ptsB = String(100-nA);
      renderKeepFocus("ptsA");
    }
    if(e.target.id==="ptsB"){
      var vB = sanitizeSignedInt(e.target.value);
      draft.roundForm.ptsB = vB;
      var nB = parseInt(vB,10);
      if(!isNaN(nB)) draft.roundForm.ptsA = String(100-nB);
      renderKeepFocus("ptsB");
    }
  });

  function sanitizeSignedInt(v){
    v = v.replace(/[^0-9-]/g,'');
    v = v.charAt(0)+v.slice(1).replace(/-/g,'');
    if(v==="-") return v;
    return v;
  }

  function toggleSign(side){
    var f = draft.roundForm;
    var key = side==="A" ? "ptsA" : "ptsB";
    var otherKey = side==="A" ? "ptsB" : "ptsA";
    var v = f[key];
    if(v==="" || v==="-"){ f[key] = v==="-" ? "" : "-"; }
    else if(v.charAt(0)==="-"){ f[key] = v.slice(1); }
    else { f[key] = "-"+v; }
    var n = parseInt(f[key],10);
    if(!isNaN(n)) f[otherKey] = String(100-n);
    render();
  }

  function renderKeepFocus(id){
    var sel = null;
    var el0 = document.getElementById(id);
    if(el0) sel = [el0.selectionStart, el0.selectionEnd];
    render();
    var el1 = document.getElementById(id);
    if(el1){ el1.focus(); if(sel){ try{ el1.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
  }

  document.addEventListener("change", function(e){
    if(e.target.id==="importFileInput" && e.target.files && e.target.files[0]){
      handleImportFile(e.target.files[0]);
      e.target.value = "";
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target.id==="newPlayerInput"){ proceedToAvatarPick(); }
  });

  /* ---------- init ---------- */
  load();
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  }).catch(function(e){});
}
if (window.caches && caches.keys) {
  caches.keys().then(function(names){
    names.forEach(function(n){ caches.delete(n); });
  }).catch(function(e){});
}
</script>
